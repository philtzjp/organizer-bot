name: deploy

# main に入ったら、bot の Worker をデプロイする。
# 組織に固有の値はコードに書かず、Environment cloudflare の variable と secret から渡す。値は philtzjp/pulumi が届ける
on:
    push:
        branches: [main]
        paths:
            - apps/organizer-bot/**
            - packages/conventions/**
            - pnpm-lock.yaml
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    deploy:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: cloudflare
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            WORKER_DOMAIN: ${{ vars.WORKER_DOMAIN }}
            ORGANIZATION: ${{ vars.ORGANIZATION }}
            BOT_LOGIN: ${{ vars.BOT_LOGIN }}
            BOT_USER_ID: ${{ vars.BOT_USER_ID }}
            CONVENTIONS_REPOSITORY: ${{ vars.CONVENTIONS_REPOSITORY }}
            CHECKER_REPOSITORY: ${{ vars.CHECKER_REPOSITORY }}
            SKILLS_REPOSITORY: ${{ vars.SKILLS_REPOSITORY }}
            PROFILE_REPOSITORY: ${{ vars.PROFILE_REPOSITORY }}
            STATS_EXCLUDED_REPOSITORIES: ${{ vars.STATS_EXCLUDED_REPOSITORIES }}
        steps:
            - name: デプロイに要る値があることを確かめる
              run: |
                  missing=""
                  for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID WORKER_DOMAIN ORGANIZATION BOT_LOGIN BOT_USER_ID CONVENTIONS_REPOSITORY CHECKER_REPOSITORY SKILLS_REPOSITORY PROFILE_REPOSITORY; do
                      eval "value=\${$name}"
                      [ -z "$value" ] && missing="$missing $name"
                  done
                  if [ -n "$missing" ]; then
                      echo "Environment cloudflare に次の値がありません:$missing"
                      exit 1
                  fi
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec turbo run typecheck test --filter @philtz/organizer-bot
            - name: Worker をデプロイする
              working-directory: apps/organizer-bot
              run: |
                  pnpm exec wrangler deploy \
                      --domain "$WORKER_DOMAIN" \
                      --var "ORGANIZATION:$ORGANIZATION" \
                      --var "BOT_LOGIN:$BOT_LOGIN" \
                      --var "BOT_USER_ID:$BOT_USER_ID" \
                      --var "CONVENTIONS_REPOSITORY:$CONVENTIONS_REPOSITORY" \
                      --var "CHECKER_REPOSITORY:$CHECKER_REPOSITORY" \
                      --var "SKILLS_REPOSITORY:$SKILLS_REPOSITORY" \
                      --var "PROFILE_REPOSITORY:$PROFILE_REPOSITORY" \
                      --var "STATS_EXCLUDED_REPOSITORIES:$STATS_EXCLUDED_REPOSITORIES"

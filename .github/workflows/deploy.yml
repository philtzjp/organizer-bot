name: deploy

# main に入ったら、philtzjp の philtz-organizer-bot の Worker をデプロイする。
# 手順は deploy-worker にあり、値は Environment cloudflare から読む。値は philtzjp/pulumi が届ける。
# ほかの組織の bot は、その組織のリポジトリが deploy-worker を呼んでデプロイする。README を参照する
on:
    push:
        branches: [main]
        paths:
            - apps/organizer-bot/**
            - packages/conventions/**
            - pnpm-lock.yaml
            - .github/workflows/deploy.yml
            - .github/workflows/deploy-worker.yml
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        if: github.ref == 'refs/heads/main'
        uses: ./.github/workflows/deploy-worker.yml
        with:
            environment: cloudflare
            ref: ${{ github.sha }}

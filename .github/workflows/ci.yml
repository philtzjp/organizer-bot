name: ci

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm exec turbo run build typecheck test
            # philtz-organizer-bot は、コミットされた skill/cli.mjs を conventions スキルに写す。ソースと食い違っていたら止める
            - name: conventions スキルの検査器がソースと同じかを確かめる
              run: |
                  if ! git diff --exit-code -- packages/conventions/skill; then
                      echo "packages/conventions/skill/cli.mjs が古い。packages/conventions で pnpm run build を実行してコミットしてください"
                      exit 1
                  fi
